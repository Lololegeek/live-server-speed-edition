name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: npm ci
      - run: npm test
      - run: npm run package -- --out live-server-speed-edition-1.3.0.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}-${{ matrix.node }}
          path: '*.vsix'
